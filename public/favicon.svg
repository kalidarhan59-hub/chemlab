<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#0B1220" stroke="url(#flaskGrad)" stroke-width="3" />
  <!-- Flask shape -->
  <path d="M43 24 H57 V38 L72 68 C74.5 73 70.8 78 65 78 H35 C29.2 78 25.5 73 28 68 L43 38 Z" 
        stroke="url(#flaskGrad)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none" />
  <!-- Liquid -->
  <path d="M33 60 C40 57 45 63 52 60 C58 57 63 60 67 60 L69 64 C70 66 68 70 65 70 H35 C32 70 30 66 31 64 Z" 
        fill="url(#flaskGrad)" opacity="0.8" />
  <!-- Atom ring -->
  <ellipse cx="50" cy="50" rx="36" ry="12" stroke="#14B8A6" stroke-width="1.5" stroke-dasharray="3 3" transform="rotate(-30 50 50)" opacity="0.7" />
  <circle cx="24" cy="38" r="2.5" fill="#14B8A6" filter="url(#glow)" />
  <circle cx="76" cy="62" r="2.5" fill="#7C3AED" filter="url(#glow)" />
  <!-- Bubbles -->
  <circle cx="46" cy="52" r="2" fill="#FFFFFF" opacity="0.8" />
  <circle cx="54" cy="46" r="1.5" fill="#FFFFFF" opacity="0.6" />
  <circle cx="48" cy="40" r="1" fill="#FFFFFF" opacity="0.7" />
</svg>
