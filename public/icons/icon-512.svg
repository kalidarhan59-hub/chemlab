<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="flaskGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0B1220" />
  <circle cx="256" cy="256" r="210" stroke="url(#flaskGrad512)" stroke-width="8" opacity="0.4" />
  
  <!-- Atom orbits -->
  <ellipse cx="256" cy="256" rx="180" ry="60" stroke="#14B8A6" stroke-width="4" stroke-dasharray="8 8" transform="rotate(-30 256 256)" opacity="0.6" />
  <ellipse cx="256" cy="256" rx="180" ry="60" stroke="#7C3AED" stroke-width="4" stroke-dasharray="8 8" transform="rotate(30 256 256)" opacity="0.6" />

  <!-- Flask Body -->
  <path d="M220 120 H292 V190 L368 340 C380 365 362 390 334 390 H178 C150 390 132 365 144 340 L220 190 Z" 
        stroke="url(#flaskGrad512)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="rgba(19, 28, 46, 0.6)" />
  
  <!-- Liquid -->
  <path d="M168 300 C200 285 228 315 264 300 C300 285 328 300 344 300 L354 320 C364 340 350 360 330 360 H182 C162 360 148 340 158 320 Z" 
        fill="url(#flaskGrad512)" opacity="0.85" filter="url(#glow512)" />

  <!-- Orbiting electrons -->
  <circle cx="110" cy="190" r="14" fill="#14B8A6" filter="url(#glow512)" />
  <circle cx="402" cy="322" r="14" fill="#7C3AED" filter="url(#glow512)" />
  <circle cx="390" cy="180" r="12" fill="#F59E0B" filter="url(#glow512)" />

  <!-- Rising particles -->
  <circle cx="236" cy="260" r="8" fill="#FFFFFF" opacity="0.8" />
  <circle cx="276" cy="230" r="6" fill="#FFFFFF" opacity="0.7" />
  <circle cx="248" cy="195" r="4" fill="#FFFFFF" opacity="0.9" />
</svg>
